---
name: ".Deploy Levels (Abstract)"
on:
  workflow_call:
    inputs:
      ci_config:
        required: true
        type: string
      env:
        required: true
        type: string
      default_location:
        required: false
        default: "northeurope"
        type: string
      external_repos:
        required: false
        default: "[]"
        type: string
      actions-version:
        required: false
        default: "1.5.0"
        description: "Github Repo branch for shared actions."
        type: string
      actions-repository:
        required: false
        default: "GEBITSolutions/stax"
        type: string

jobs:
  l0:
    uses: ./.github/workflows/a-wf-deploy-stack.yml
    name: ${{ join(fromJson(inputs.ci_config)[0].*.name,',') || 'No Jobs' }}
    strategy:
      fail-fast: false
      matrix:
        data: ${{ fromJson(inputs.ci_config)[0] }}
    with:
      default-location: ${{ inputs.default_location }}
      env: ${{ inputs.env }}
      data: "${{ toJson(matrix.data) }}"
      external-repos: "${{ inputs.external_repos }}"
      actions-version: ${{ inputs.actions-version }}
      actions-repository: ${{ inputs.actions-repository }}
    secrets: inherit

  l1:
    uses: ./.github/workflows/a-wf-deploy-stack.yml
    if: fromJson(inputs.ci_config)[1][0] != null
    needs: [l0]
    name: ${{ join(fromJson(inputs.ci_config)[1].*.name,',') || 'No Jobs' }}
    strategy:
      fail-fast: false
      matrix:
        data: ${{ fromJson(inputs.ci_config)[1] }}
    with:
      env: ${{ inputs.env }}
      default-location: ${{ inputs.default_location }}
      data: "${{ toJson(matrix.data) }}"
      external-repos: "${{ inputs.external_repos }}"
      actions-version: ${{ inputs.actions-version }}
      actions-repository: ${{ inputs.actions-repository }}
    secrets: inherit

  l2:
    uses: ./.github/workflows/a-wf-deploy-stack.yml
    if: fromJson(inputs.ci_config)[2][0] != null
    needs: [l0, l1]
    name: ${{ join(fromJson(inputs.ci_config)[2].*.name,',') || 'No Jobs' }}
