---
# yamllint disable rule:line-length
name: ".Packer Hetzner Workflow (Abstract)"
on:
  workflow_call:
    inputs:
      data:
        type: string
        required: true
      env:
        type: string
        required: true
      external-repos:
        type: string
        required: false
        default: "[]"
      actions-repository:
        type: string
        required: false
        default: "GEBITSolutions/stax"
      actions-version:
        type: string
        required: false
        default: "1.5.0"
    outputs:
      image_id:
        description: "Hetzner snapshot id"
        value: ${{ jobs.packer.outputs.image_id }}
      image_ref:
        description: "Opaque locator hcloud:snapshot:<id>"
        value: ${{ jobs.packer.outputs.image_ref }}
      build_target:
        description: "Always hetzner"
        value: ${{ jobs.packer.outputs.build_target }}
      version:
        description: "Derived version 0.0.0+<git sha>"
        value: ${{ jobs.packer.outputs.version }}
      labels:
        description: "JSON object of labels on the snapshot"
        value: ${{ jobs.packer.outputs.labels }}
      git_sha:
        description: "Source commit recorded for this build"
        value: ${{ jobs.packer.outputs.git_sha }}
    secrets:
      ARM_CLIENT_SECRET:
        required: false
      ARM_CLIENT_ID:
        required: false
      ARM_TENANT_ID:
        required: false
      REPO_KEYSTORE_SP_CLIENT_SECRET:
        required: false
      RELEASE_APP_CLIENT_SECRET:
        required: false
      RELEASE_GH_APP_PRIVATE_KEY:
        required: false
      CI_ENV_TRANSFER_GH_TOKEN:
        required: false
      HCLOUD_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  packer:
    name: "Packer ${{ fromJson(inputs.data)['name'] || fromJson(inputs.data)['id'] }}"
    runs-on: ${{ fromJson(inputs.data)['runs-on'] || vars.RUNNER || 'ubuntu-22.04' }}
    environment: ${{ fromJson(inputs.env)['environment'] || 'dev' }}
    outputs:
      image_id: ${{ steps.publish.outputs.image_id }}
      image_ref: ${{ steps.publish.outputs.image_ref }}
      build_target: ${{ steps.publish.outputs.build_target }}
      version: ${{ steps.publish.outputs.version }}
      labels: ${{ steps.publish.outputs.labels }}
      git_sha: ${{ steps.publish.outputs.git_sha }}
      transfer_requested: ${{ steps.preflight.outputs.transfer-requested }}
      actions_sha: ${{ steps.resolve-actions-ref.outputs.sha }}
      workflow_repository: ${{ steps.workflow-source.outputs.repository }}
      workflow_ref: ${{ steps.workflow-source.outputs.ref }}
    env:
      ENVIRONMENT: ${{ fromJson(inputs.env)['environment'] || 'dev' }}
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID || secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID || secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: ${{ vars.OIDC_ENABLED || 'false' }}
      ARM_USE_AZUREAD: ${{ vars.OIDC_ENABLED || 'false' }}
    steps:
    - name: Validate request before checkout
      id: preflight
      shell: bash
      env:
        DATA_JSON: ${{ inputs.data }}
        PIPELINE_ENV_JSON: ${{ inputs.env }}
        EXTERNAL_REPOS_JSON: ${{ inputs.external-repos || '[]' }}
        ACTIONS_REPOSITORY: ${{ inputs.actions-repository }}
        ACTIONS_VERSION: ${{ inputs.actions-version }}
        KEY_VAULT_URL: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL }}
        TRANSFER_PAT_AVAILABLE: ${{ secrets.CI_ENV_TRANSFER_GH_TOKEN != '' && 'true' || 'false' }}
        HCLOUD_TOKEN_AVAILABLE: ${{ secrets.HCLOUD_TOKEN != '' && 'true' || 'false' }}
        TRANSFER_APP_CREDENTIALS_AVAILABLE: ${{ (vars.RELEASE_APP_CLIENT_ID != '' || vars.RELEASE_GH_APP_ID != '') && (secrets.RELEASE_APP_CLIENT_SECRET
          != '' || secrets.RELEASE_GH_APP_PRIVATE_KEY != '') && 'true' || 'false' }}
      run: |
        set -euo pipefail

        jq -e 'type == "object"' <<< "$DATA_JSON" > /dev/null || {
          echo "::error::Packer data must be a JSON object."
          exit 1
        }
        jq -e 'type == "object"' <<< "$PIPELINE_ENV_JSON" > /dev/null || {
          echo "::error::Packer env must be a JSON object."
          exit 1
        }
        jq -e 'type == "object" or (type == "array" and length == 0)' <<< "$EXTERNAL_REPOS_JSON" > /dev/null || {
          echo "::error::external-repos must be a JSON object or an empty array."
          exit 1
        }

        if [[ "$ACTIONS_REPOSITORY" != "GEBITSolutions/stax" ]]; then
          echo "::error::Packer trusted actions must come from GEBITSolutions/stax."
          exit 1
        fi
        if [[ "$ACTIONS_VERSION" != "main" && ! "$ACTIONS_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ && ! "$ACTIONS_VERSION" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::actions-version must be main, a numeric semantic version tag with optional v prefix, or a full 40-character commit SHA."
          exit 1
        fi

        parse_flag() {
          local key="$1"
          local default_value="$2"
          jq -r --arg key "$key" --arg default_value "$default_value" '
            if (has($key) | not) then
              $default_value
            elif (.[$key] | type) == "boolean" then
              (.[$key] | tostring)
            elif (.[$key] | type) == "string" and (.[$key] == "true" or .[$key] == "false") then
              .[$key]
            else
              error($key + " must be the literal true or false")
            end
          ' <<< "$PIPELINE_ENV_JSON"
        }

        dry_run="$(parse_flag dry_run true)" || {
          echo "::error::dry_run must be the literal true or false."
          exit 1
        }
        destroy="$(parse_flag destroy false)" || {
          echo "::error::destroy must be the literal true or false."
          exit 1
        }

        data_destroy="$(jq -r '
          if has("destroy") | not then
            "false"
          elif .destroy == true or .destroy == "true" then
            "true"
          elif .destroy == false or .destroy == "false" then
            "false"
          else
            "invalid"
          end
        ' <<< "$DATA_JSON")"
        if [[ "$data_destroy" == "invalid" ]]; then
          echo "::error::destroy must be the literal true or false."
          exit 1
        fi
        if [[ "$data_destroy" == "true" ]]; then
          destroy="true"
        fi

        if [[ "$(jq -r '.type // empty' <<< "$DATA_JSON")" != "packer" ]]; then
          echo "::error::The Packer executor only accepts descriptors with type 'packer'."
          exit 1
        fi

        build_target="$(jq -r '
          if has("build_target") | not then
            ""
          elif (.build_target | type) == "string" then
            .build_target
          else
            "invalid"
          end
        ' <<< "$DATA_JSON")"
        if [[ "$build_target" != "hetzner" ]]; then
          echo "::error::The Hetzner Packer workflow only accepts build_target hetzner."
          exit 1
        fi
        if ! jq -e '.hetzner | type == "object" and (.location | type == "string") and (.server_type | type == "string")' <<< "$DATA_JSON" > /dev/null; then
          echo "::error::build_target hetzner requires hetzner.location and hetzner.server_type."
          exit 1
        fi

        packer_version="$(jq -er 'if (.packer_version | type) == "string" then .packer_version else error("packer_version must be a string") end' <<< "$DATA_JSON")" || {
          echo "::error::packer_version must be an exact version string."
          exit 1
        }
        if [[ ! "$packer_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::packer_version must be an exact numeric version such as 1.11.2."
          exit 1
        fi

        validate_relative_path() {
          local value="$1"
          local label="$2"

          if [[ -z "$value" || "$value" == /* || "$value" =~ ^[A-Za-z]: || "$value" == *\\* || "$value" == *//* || "$value" == */ ]]; then
            echo "::error::$label must be a nonempty repository-relative POSIX path."
            exit 1
          fi
          if [[ "$value" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::$label must not contain a '..' path segment."
            exit 1
          fi
        }

        packer_directory="$(jq -er '
          if (.packer_directory | type) == "string" and (.packer_directory | explode | all(. >= 32 and . != 127)) then
            .packer_directory
          else
            error("packer_directory must be a string without control characters")
          end
        ' <<< "$DATA_JSON")" || {
          echo "::error::packer_directory must be a string without control characters."
          exit 1
        }
        packer_template="$(jq -er '
          if has("packer_template") | not then
            "."
          elif (.packer_template | type) == "string" and (.packer_template | explode | all(. >= 32 and . != 127)) then
            .packer_template
          else
            error("packer_template must be a string without control characters")
          end
        ' <<< "$DATA_JSON")" || {
          echo "::error::packer_template must be a string without control characters."
          exit 1
        }
        validate_relative_path "$packer_directory" packer_directory
        validate_relative_path "$packer_template" packer_template
        if ! jq -e '
          if type == "object" then
            all(keys[]; test("^[A-Za-z0-9][A-Za-z0-9._-]*$") and . != "." and . != "..")
          else
            true
          end
        ' <<< "$EXTERNAL_REPOS_JSON" > /dev/null; then
          echo "::error::Every external-repos alias must be a safe single path component."
          exit 1
        fi

        excluded_secret_names="$(jq -cn --argjson external_repos "$EXTERNAL_REPOS_JSON" '
          [
            "ARM_CLIENT_ID",
            "ARM_CLIENT_SECRET",
            "ARM_SUBSCRIPTION_ID",
            "ARM_TENANT_ID",
            "HCLOUD_TOKEN",
            "CI_ENV_TRANSFER_GH_TOKEN",
            "CI_GITHUB_TOKEN_SHARED_CODE",
            "RELEASE_APP_CLIENT_SECRET",
            "RELEASE_GH_APP_PRIVATE_KEY",
            "REPO_KEYSTORE_SP_CLIENT_SECRET"
          ] + (
            if ($external_repos | type) == "object" then
              [
                $external_repos[]
                | select(type == "array" and length > 0 and (.[0] | type) == "object")
                | .[0].token?
                | select(type == "string" and length > 0)
              ]
            else
              []
            end
          )
          | unique
        ')"

        source_alias="$(jq -er '
          if has("source_repo") | not then ""
          elif (.source_repo | type) == "string" then .source_repo
          else error("source_repo must be a string")
          end
        ' <<< "$DATA_JSON")" || {
          echo "::error::source_repo must be a string."
          exit 1
        }
        if [[ -n "$source_alias" ]] && ! jq -e --arg alias "$source_alias" '
          type == "object" and has($alias) and (.[$alias] | type == "array") and (.[$alias] | length > 0)
        ' <<< "$EXTERNAL_REPOS_JSON" > /dev/null; then
          echo "::error::source_repo alias '$source_alias' was not found in external-repos."
          exit 1
        fi

        output_requested="$(jq -r '
          (."output-var" // []) as $outputs
          | if ($outputs | type) != "array" or any($outputs[]; type != "string") then
              error("output-var must be an array of strings")
            else
              (["image_id", "image_ref", "build_target", "version", "labels", "git_sha"] as $known
                | any($outputs[]; . as $name | ($known | index($name)) != null))
            end
        ' <<< "$DATA_JSON")" || {
          echo "::error::output-var must be an array of strings."
          exit 1
        }

        if [[ "$output_requested" == "true" ]]; then
          stack_id="$(jq -r '.id // empty' <<< "$DATA_JSON" | tr '-' '_')"
          if [[ ! "$stack_id" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::Stack id cannot be converted to a valid output variable prefix."
            exit 1
          fi

          if [[ "$dry_run" == "false" ]]; then
            if [[ -z "$ENVIRONMENT" ]]; then
              echo "::error::An environment is required to transfer image_id."
              exit 1
            fi
            if [[ -z "$KEY_VAULT_URL" && "$TRANSFER_PAT_AVAILABLE" != "true" && "$TRANSFER_APP_CREDENTIALS_AVAILABLE" != "true" ]]; then
              echo "::error::No GitHub transfer credential is configured for the requested image_id transfer."
              exit 1
            fi
          fi
        fi

        if [[ "$dry_run" == "false" && "$HCLOUD_TOKEN_AVAILABLE" != "true" ]]; then
          echo "::error::The HCLOUD_TOKEN secret is required on the GitHub Environment for a Hetzner Packer build or destroy."
          exit 1
        fi

        {
          echo "dry-run=$dry_run"
          echo "destroy=$destroy"
          echo "packer-version=$packer_version"
          echo "transfer-requested=$output_requested"
          echo "actions-version=$ACTIONS_VERSION"
          echo "excluded-secret-names=$excluded_secret_names"
        } >> "$GITHUB_OUTPUT"

    - name: Resolve App Token Scope
      id: token-scope
      shell: bash
      env:
        EXTERNAL_REPOS_JSON: ${{ inputs.external-repos || '[]' }}
      run: |
        set -euo pipefail
        repositories="${GITHUB_REPOSITORY#*/}"
        while read -r repo_url; do
          repo_ref="$(sed -E 's#.*github\.com[:/]([^/]+)/([^/.]+)(\.git)?$#\1/\2#' <<< "$repo_url")"
          repo_owner="${repo_ref%%/*}"
          repo_name="${repo_ref#*/}"
          if [[ "$repo_owner" == "$GITHUB_REPOSITORY_OWNER" && "$repo_name" != "$repo_ref" && ",${repositories}," != *",${repo_name},"* ]]; then
            repositories="${repositories},${repo_name}"
          fi
        done < <(jq -r 'if type == "object" then .[] | .[0].repoURL // empty else empty end' <<< "$EXTERNAL_REPOS_JSON")
        echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App Token
      id: app-token
      if: ${{ vars.RELEASE_APP_CLIENT_ID != '' || vars.RELEASE_GH_APP_ID != '' }}
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_GH_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_CLIENT_SECRET || secrets.RELEASE_GH_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ steps.token-scope.outputs.repositories }}
        permission-contents: read

    - name: Resolve trusted actions revision
      id: resolve-actions-ref
      shell: bash
      env:
        ACTIONS_VERSION: ${{ steps.preflight.outputs.actions-version }}
      run: |
        set -euo pipefail

        github_api() {
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/GEBITSolutions/stax/$1"
        }

        if [[ "$ACTIONS_VERSION" == "main" ]]; then
          response="$(github_api "git/ref/heads/main")" || {
            echo "::error::Unable to resolve the approved trusted actions main branch."
            exit 1
          }
          resolved_sha="$(jq -er '.object | select(.type == "commit") | .sha | select(type == "string")' <<< "$response")" || {
            echo "::error::GitHub returned an invalid trusted actions main revision."
            exit 1
          }
        elif [[ "$ACTIONS_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          response="$(github_api "git/ref/tags/${ACTIONS_VERSION}")" || {
            echo "::error::Unable to resolve the approved trusted actions version tag."
            exit 1
          }
          object_type="$(jq -er '.object.type | select(type == "string")' <<< "$response")"
          object_sha="$(jq -er '.object.sha | select(type == "string")' <<< "$response")"
          resolved_sha=""
          for ((depth = 0; depth < 10; depth++)); do
            if [[ "$object_type" == "commit" ]]; then
              resolved_sha="$object_sha"
              break
            fi
            if [[ "$object_type" != "tag" || ! "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              break
            fi
            response="$(github_api "git/tags/${object_sha}")" || {
              echo "::error::Unable to resolve the approved annotated trusted actions tag."
              exit 1
            }
            object_type="$(jq -er '.object.type | select(type == "string")' <<< "$response")"
            object_sha="$(jq -er '.object.sha | select(type == "string")' <<< "$response")"
          done
        else
          response="$(github_api "commits/${ACTIONS_VERSION}")" || {
            echo "::error::Unable to resolve the approved trusted actions commit SHA."
            exit 1
          }
          resolved_sha="$(jq -er '.sha | select(type == "string")' <<< "$response")" || {
            echo "::error::GitHub returned an invalid trusted actions commit revision."
            exit 1
          }
          if [[ "${resolved_sha,,}" != "${ACTIONS_VERSION,,}" ]]; then
            echo "::error::actions-version must identify the exact trusted actions commit."
            exit 1
          fi
        fi

        if [[ ! "$resolved_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::GitHub did not resolve the trusted actions revision to a full commit SHA."
          exit 1
        fi
        resolved_sha="${resolved_sha,,}"
        echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
        printf '### Trusted actions\n\n- Resolved SHA: `%s`\n' "$resolved_sha" >> "$GITHUB_STEP_SUMMARY"

    - name: Prepare trusted actions checkout
      shell: bash
      run: |
        set -euo pipefail
        rm -rf -- "$GITHUB_WORKSPACE/trusted-actions"

    - name: Checkout trusted actions
      uses: actions/checkout@v7
      with:
        repository: GEBITSolutions/stax
        ref: ${{ steps.resolve-actions-ref.outputs.sha }}
        path: trusted-actions
        clean: true
        persist-credentials: false

    - name: Prepare source checkout roots
      shell: bash
      run: |
        set -euo pipefail
        rm -rf -- "$GITHUB_WORKSPACE/source_repo" "$GITHUB_WORKSPACE/externalRepos"

    - name: Determine source repository and token
      id: source-repo
      shell: bash
      env:
        DATA_JSON: ${{ inputs.data }}
        EXTERNAL_REPOS_JSON: ${{ inputs.external-repos || '[]' }}
        ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        source_alias="$(jq -r '.source_repo // empty' <<< "$DATA_JSON")"
        source_version="$(jq -r '.source_version // empty' <<< "$DATA_JSON")"

        if [[ -n "$source_alias" ]]; then
          repo="$(jq -cer --arg alias "$source_alias" '.[$alias][0]' <<< "$EXTERNAL_REPOS_JSON")"
          repo_url="$(jq -r '.repoURL // empty' <<< "$repo")"
          target_revision="$(jq -r '.targetRevision // empty' <<< "$repo")"
          repo_ref="$(sed -E 's#.*github\.com[:/]([^/]+)/([^/.]+)(\.git)?$#\1/\2#' <<< "$repo_url")"
          if [[ "$repo_ref" != */* || "$repo_ref" == "$repo_url" ]]; then
            echo "::error::source_repo '$source_alias' does not contain a supported GitHub repository URL."
            exit 1
          fi
          if [[ -z "$source_version" ]]; then
            source_version="$target_revision"
          fi
          if [[ -z "$source_version" ]]; then
            echo "::error::source_repo '$source_alias' requires source_version or targetRevision."
            exit 1
          fi

          repo_org="${repo_ref%%/*}"
          use_app_token="$(jq -r '.use_app_token // false' <<< "$repo")"
          token_name="$(jq -r '.token // empty' <<< "$repo")"
          token_value=""

          if [[ "$use_app_token" == "true" && "$repo_org" == "$GITHUB_REPOSITORY_OWNER" ]]; then
            token_value="$APP_TOKEN"
          fi
          if [[ -z "$token_value" && -n "$token_name" ]]; then
            token_value="$(jq -r --arg token "$token_name" '.[$token] // empty' <<< "$ALL_SECRETS_JSON")"
          fi

          echo "stack-repository=$repo_ref" >> "$GITHUB_OUTPUT"
          if [[ -n "$token_value" ]]; then
            echo "stack-repository-token=$token_value" >> "$GITHUB_OUTPUT"
          fi
        fi

        if [[ -n "$source_version" ]]; then
          echo "stack-repository-version=$source_version" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout Source Repository
      uses: actions/checkout@v7
      with:
        path: source_repo
        repository: ${{ steps.source-repo.outputs.stack-repository || github.repository }}
        ref: ${{ steps.source-repo.outputs.stack-repository-version || github.sha }}
        token: ${{ steps.source-repo.outputs.stack-repository-token || github.token }}
        clean: true
        persist-credentials: false

    - name: Record resolved source revision
      id: source-sha
      shell: bash
      run: |
        set -euo pipefail
        source_sha="$(git -C "$GITHUB_WORKSPACE/source_repo" rev-parse HEAD)"
        echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
        printf '### Packer source\n\n- Resolved source SHA: `%s`\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"

    - name: Resolve workflow source
      id: workflow-source
      shell: bash
      env:
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        if [[ ! "$WORKFLOW_REF" =~ ^[^/]+/[^/]+/\.github/workflows/[^@]+@.+$ ]]; then
          echo "::error::github.workflow_ref is not a reusable workflow reference."
          exit 1
        fi
        repository="${WORKFLOW_REF%%/.github/workflows/*}"
        git_ref="${WORKFLOW_REF##*@}"
        {
          echo "repository=$repository"
          echo "ref=$git_ref"
        } >> "$GITHUB_OUTPUT"

    - name: Checkout Packer workflow scripts
      uses: actions/checkout@v7
      with:
        repository: ${{ steps.workflow-source.outputs.repository }}
        ref: ${{ steps.workflow-source.outputs.ref }}
        path: workflow-src
        persist-credentials: false

    - name: Checkout external repositories
      shell: bash
      env:
        EXTERNAL_REPOS_JSON: ${{ inputs.external-repos || '[]' }}
        ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        EXTERNAL_REPOS_ROOT: ${{ github.workspace }}/externalRepos
      run: |
        set -euo pipefail
        rm -rf -- "$EXTERNAL_REPOS_ROOT"
        mkdir -p -- "$EXTERNAL_REPOS_ROOT"
        external_root="$(realpath -e -- "$EXTERNAL_REPOS_ROOT")"

        while read -r repo; do
          name="$(jq -r '.key' <<< "$repo")"
          if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$name" == "." || "$name" == ".." ]]; then
            echo "::error::External repository alias '$name' is not a safe single path component."
            exit 1
          fi
          definition="$(jq -cer '.value[0]' <<< "$repo")"
          repo_url="$(jq -r '.repoURL // empty' <<< "$definition")"
          target_revision="$(jq -r '.targetRevision // empty' <<< "$definition")"
          use_app_token="$(jq -r '.use_app_token // false' <<< "$definition")"
          token_name="$(jq -r '.token // empty' <<< "$definition")"
          repo_ref="$(sed -E 's#.*github\.com[:/]([^/]+)/([^/.]+)(\.git)?$#\1/\2#' <<< "$repo_url")"

          if [[ -z "$name" || "$repo_ref" != */* || "$repo_ref" == "$repo_url" || -z "$target_revision" ]]; then
            echo "::error::External repository '$name' has an invalid repoURL or targetRevision."
            exit 1
          fi

          repo_org="${repo_ref%%/*}"
          token_value=""
          if [[ "$use_app_token" == "true" && "$repo_org" == "$GITHUB_REPOSITORY_OWNER" ]]; then
            token_value="$APP_TOKEN"
          fi
          if [[ -z "$token_value" && -n "$token_name" ]]; then
            token_value="$(jq -r --arg token "$token_name" '.[$token] // empty' <<< "$ALL_SECRETS_JSON")"
          fi
          destination="$(realpath -m -- "$external_root/$name")"
          if [[ "$destination" != "$external_root"/* ]]; then
            echo "::error::External repository destination escapes externalRepos."
            exit 1
          fi

          mkdir -p -- "$destination"
          git -C "$destination" init --quiet
          if [[ -n "$token_value" ]]; then
            basic_auth="$(printf 'x-access-token:%s' "$token_value" | base64 | tr -d '\n')"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic_auth" \
              git -C "$destination" fetch --quiet --depth=1 --no-tags \
                "https://github.com/${repo_ref}.git" "$target_revision"
          else
            git -C "$destination" fetch --quiet --depth=1 --no-tags \
              "https://github.com/${repo_ref}.git" "$target_revision"
          fi
          git -C "$destination" checkout --quiet --detach FETCH_HEAD
          canonical_destination="$(realpath -e -- "$destination")"
          if [[ "$canonical_destination" != "$external_root"/* ]]; then
            rm -rf -- "$destination"
            echo "::error::External repository destination resolves outside externalRepos."
            exit 1
          fi
          unset basic_auth token_value
        done < <(jq -c 'if type == "object" then to_entries[] else empty end' <<< "$EXTERNAL_REPOS_JSON")

    - name: Convert Inputs
      id: convert-inputs
      if: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL == '' }}
      uses: ./trusted-actions/.github/actions/gh-convert-stack-inputs
      with:
        variables: ${{ toJson(vars) }}
        secrets: ${{ toJson(secrets) }}
        excluded-secrets: ${{ steps.preflight.outputs.excluded-secret-names }}
        convertInputs: ${{ fromJson(inputs.data)['input'] && toJson(fromJson(inputs.data)['input']) || '[]' }}
        config-globals: ${{ fromJson(inputs.data)['config_globals'] && toJson(fromJson(inputs.data)['config_globals']) ||
          '{}' }}
        pipeline-globals: ${{ inputs.env }}
        allowNull: "false"

    - name: Convert Inputs Key Vault (ARM SP)
      id: convert-inputs-key-vault
      if: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL != '' && vars.REPO_KEYSTORE_SP_CLIENT_ID == '' }}
      uses: ./trusted-actions/.github/actions/gh-convert-stack-inputs
      with:
        variables: ${{ toJson(vars) }}
        secrets: ${{ toJson(secrets) }}
        excluded-secrets: ${{ steps.preflight.outputs.excluded-secret-names }}
        convertInputs: ${{ fromJson(inputs.data)['input'] && toJson(fromJson(inputs.data)['input']) || '[]' }}
        config-globals: ${{ fromJson(inputs.data)['config_globals'] && toJson(fromJson(inputs.data)['config_globals']) ||
          '{}' }}
        pipeline-globals: ${{ inputs.env }}
        allowNull: "false"
        environment-name: ${{ env.ENVIRONMENT }}
        key-vault-url: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL }}
        key-vault-sp-client-id: ${{ env.ARM_CLIENT_ID }}
        key-vault-sp-client-secret: ${{ vars.OIDC_ENABLED != 'true' && secrets.ARM_CLIENT_SECRET || '' }}
        key-vault-sp-tenant-id: ${{ env.ARM_TENANT_ID }}
        oidc-enabled: ${{ vars.OIDC_ENABLED || 'false' }}

    - name: Convert Inputs Key Vault (Keystore SP)
      id: convert-inputs-key-vault-keystore
      if: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL != '' && vars.REPO_KEYSTORE_SP_CLIENT_ID != '' }}
      uses: ./trusted-actions/.github/actions/gh-convert-stack-inputs
      with:
        variables: ${{ toJson(vars) }}
        secrets: ${{ toJson(secrets) }}
        excluded-secrets: ${{ steps.preflight.outputs.excluded-secret-names }}
        convertInputs: ${{ fromJson(inputs.data)['input'] && toJson(fromJson(inputs.data)['input']) || '[]' }}
        config-globals: ${{ fromJson(inputs.data)['config_globals'] && toJson(fromJson(inputs.data)['config_globals']) ||
          '{}' }}
        pipeline-globals: ${{ inputs.env }}
        allowNull: "false"
        environment-name: ${{ env.ENVIRONMENT }}
        key-vault-url: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL }}
        key-vault-sp-client-id: ${{ vars.REPO_KEYSTORE_SP_CLIENT_ID }}
        key-vault-sp-client-secret: ${{ vars.REPO_KEYSTORE_OIDC_ENABLED != 'true' && secrets.REPO_KEYSTORE_SP_CLIENT_SECRET
          || '' }}
        key-vault-sp-tenant-id: ${{ vars.REPO_KEYSTORE_SP_TENANT_ID }}
        oidc-enabled: ${{ vars.REPO_KEYSTORE_OIDC_ENABLED || 'false' }}

    - name: Install exact Packer version
      shell: bash
      env:
        PACKER_VERSION: ${{ steps.preflight.outputs.packer-version }}
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" != "Linux" || "$(uname -m)" != "x86_64" ]]; then
          echo "::error::The current Packer download supports Linux x86_64 runners only."
          exit 1
        fi

        archive_name="packer_${PACKER_VERSION}_linux_amd64.zip"
        archive="${RUNNER_TEMP}/${archive_name}"
        sums="${RUNNER_TEMP}/packer_${PACKER_VERSION}_SHA256SUMS"
        install_dir="${RUNNER_TEMP}/packer-${PACKER_VERSION}"

        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "$archive" "https://releases.hashicorp.com/packer/${PACKER_VERSION}/${archive_name}"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "$sums" "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_SHA256SUMS"

        expected="$(awk -v name="$archive_name" '$2 == name || $2 == "*" name {print $1}' "$sums")"
        if [[ ! "$expected" =~ ^[0-9a-fA-F]{64}$ ]]; then
          echo "::error::HashiCorp checksum manifest did not contain exactly one valid checksum for $archive_name."
          exit 1
        fi
        printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status

        mkdir -p "$install_dir"
        unzip -q "$archive" -d "$install_dir"
        chmod 0755 "$install_dir/packer"
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/packer" version > /dev/null
        # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
        printf '\n- Packer version: `%s`\n' "$PACKER_VERSION" >> "$GITHUB_STEP_SUMMARY"

    - name: Write private Packer variables
      id: packer-vars
      shell: bash
      env:
        CONVERTED_VARS: ${{ steps.convert-inputs-key-vault-keystore.outputs.tf-vars-map || steps.convert-inputs-key-vault.outputs.tf-vars-map
          || steps.convert-inputs.outputs.tf-vars-map || '[]' }}
      run: |
        set -euo pipefail
        umask 077
        packer_vars_file="$(mktemp "${RUNNER_TEMP}/packer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX.pkrvars.json")"

        jq -e '
          if type != "array" then
            error("converted inputs must be an array")
          else . end
          | map(
              if (.key | type) != "string" or (.key | length) == 0 or has("value") == false then
                error("each converted input must contain a nonempty key and a value")
              else
                {original: .key, normalized: (.key | gsub("-"; "_")), value: .value}
              end
            )
          | if any(.[]; (.normalized | test("^[A-Za-z_][A-Za-z0-9_]*$") | not)) then
              error("converted input contains a key that is not a valid Packer variable name")
            else . end
          | group_by(.normalized)
          | if any(.[]; length > 1) then
              error("converted input keys collide after replacing hyphens with underscores")
            else . end
          | map(.[0] | {key: .normalized, value: .value})
          | from_entries
        ' <<< "$CONVERTED_VARS" > "$packer_vars_file"

        chmod 0600 "$packer_vars_file"
        echo "file=$packer_vars_file" >> "$GITHUB_OUTPUT"

    - name: Resolve and validate Packer paths
      id: packer-paths
      shell: bash
      env:
        DATA_JSON: ${{ inputs.data }}
      run: |
        set -euo pipefail
        source_root="$(realpath -e -- "$GITHUB_WORKSPACE/source_repo")"
        packer_directory="$(jq -r '.packer_directory' <<< "$DATA_JSON")"
        packer_template="$(jq -r '.packer_template // "."' <<< "$DATA_JSON")"
        packer_dir="$(realpath -e -- "$source_root/$packer_directory")" || {
          echo "::error::Packer directory does not exist."
          exit 1
        }

        if [[ ! -d "$packer_dir" || "$packer_dir" != "$source_root" && "$packer_dir" != "$source_root"/* ]]; then
          echo "::error::packer_directory resolves outside the checked-out source repository or is not a directory."
          exit 1
        fi

        template_path="$(realpath -e "$packer_dir/$packer_template")" || {
          echo "::error::Packer template does not exist."
          exit 1
        }
        if [[ "$template_path" != "$packer_dir" && "$template_path" != "$packer_dir"/* ]]; then
          echo "::error::packer_template resolves outside packer_directory."
          exit 1
        fi

        echo "directory=$packer_dir" >> "$GITHUB_OUTPUT"
        echo "template=$template_path" >> "$GITHUB_OUTPUT"

    - name: Assemble Packer variables
      shell: bash
      env:
        PACKER_VARS_FILE: ${{ steps.packer-vars.outputs.file }}
        PACKER_TEMPLATE: ${{ steps.packer-paths.outputs.template }}
        DATA_JSON: ${{ inputs.data }}
        GIT_SHA: ${{ steps.source-sha.outputs.sha }}
        STACK_ENV: ${{ env.ENVIRONMENT }}
      run: |
        set -euo pipefail
        stack_file="$(mktemp)"
        printf '%s' "$DATA_JSON" > "$stack_file"
        node "$GITHUB_WORKSPACE/workflow-src/.github/scripts/packer-build-target.mjs" assemble-vars \
          --vars-file "$PACKER_VARS_FILE" \
          --template "$PACKER_TEMPLATE" \
          --stack-file "$stack_file" \
          --environment "$STACK_ENV" \
          --git-sha "$GIT_SHA"
        rm -f -- "$stack_file"

    - name: Describe Hetzner build
      shell: bash
      env:
        DATA_JSON: ${{ inputs.data }}
      run: |
        set -euo pipefail
        server_type="$(jq -r '.hetzner.server_type' <<< "$DATA_JSON")"
        location="$(jq -r '.hetzner.location' <<< "$DATA_JSON")"
        keep_last="$(jq -r 'if .hetzner.keep_last == null then 3 else .hetzner.keep_last end' <<< "$DATA_JSON")"
        snapshot_name="$(jq -r '.hetzner.snapshot_name // .id' <<< "$DATA_JSON")"
        note="$(node "$GITHUB_WORKSPACE/workflow-src/.github/scripts/packer-build-target.mjs" cost-note \
          --server-type "$server_type" --keep-last "$keep_last")"
        {
          printf '\n### Hetzner snapshot\n\n'
          # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
          printf -- '- Location: `%s`\n' "$location"
          # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
          printf -- '- Server type: `%s`\n' "$server_type"
          # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
          printf -- '- Snapshot name: `%s`\n' "$snapshot_name"
          # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
          printf -- '- Keep last: `%s`\n' "$keep_last"
          printf -- '- %s\n' "$note"
          if [[ "${{ steps.preflight.outputs.dry-run }}" == "true" ]]; then
            printf -- '- Dry run: template validation only. No server is created and retention is skipped.\n'
          elif [[ "${{ steps.preflight.outputs.destroy }}" == "true" ]]; then
            printf -- '- Destroy: labelled snapshots beyond keep_last will be deleted. No image is built.\n'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Format and validate Packer template
      shell: bash
      env:
        PACKER_DIRECTORY: ${{ steps.packer-paths.outputs.directory }}
        PACKER_TEMPLATE: ${{ steps.packer-paths.outputs.template }}
        PACKER_VARS_FILE: ${{ steps.packer-vars.outputs.file }}
        HCLOUD_TOKEN: ${{ steps.preflight.outputs.dry-run == 'true' && 'dry-run-not-a-token' || secrets.HCLOUD_TOKEN }}
      run: |
        set -euo pipefail
        cd -- "$PACKER_DIRECTORY"
        packer fmt -check "$PACKER_TEMPLATE"
        packer init "$PACKER_TEMPLATE"
        packer validate -var-file="$PACKER_VARS_FILE" "$PACKER_TEMPLATE"

    - name: Build Hetzner snapshot
      id: publish
      if: ${{ steps.preflight.outputs.dry-run == 'false' && steps.preflight.outputs.destroy != 'true' }}
      shell: bash
      env:
        PACKER_DIRECTORY: ${{ steps.packer-paths.outputs.directory }}
        PACKER_TEMPLATE: ${{ steps.packer-paths.outputs.template }}
        PACKER_VARS_FILE: ${{ steps.packer-vars.outputs.file }}
        GIT_SHA: ${{ steps.source-sha.outputs.sha }}
        HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      run: |
        set -euo pipefail
        cd -- "$PACKER_DIRECTORY"
        packer build -var-file="$PACKER_VARS_FILE" "$PACKER_TEMPLATE"
        manifest="$PACKER_DIRECTORY/manifest.json"
        if [[ ! -f "$manifest" ]]; then
          echo "::error::The template must write manifest.json with a manifest post-processor."
          exit 1
        fi
        image_id="$(node "$GITHUB_WORKSPACE/workflow-src/.github/scripts/packer-build-target.mjs" manifest-id --manifest "$manifest")"
        created="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
          --header "Authorization: Bearer ${HCLOUD_TOKEN}" \
          --header "Accept: application/json" \
          "https://api.hetzner.cloud/v1/images/${image_id}")"
        labels="$(jq -c '.image.labels // {}' <<< "$created")"
        image_ref="hcloud:snapshot:${image_id}"
        version="0.0.0+${GIT_SHA}"
        {
          echo "image_id=$image_id"
          echo "image_ref=$image_ref"
          echo "build_target=hetzner"
          echo "version=$version"
          echo "git_sha=$GIT_SHA"
          echo "labels<<STAX_LABELS_EOF"
          printf '%s\n' "$labels"
          echo "STAX_LABELS_EOF"
        } >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
        printf '\n- Snapshot id: `%s`\n- Image ref: `%s`\n' "$image_id" "$image_ref" >> "$GITHUB_STEP_SUMMARY"

    - name: Apply Hetzner snapshot retention
      if: ${{ steps.preflight.outputs.dry-run == 'false' }}
      shell: bash
      env:
        DATA_JSON: ${{ inputs.data }}
        HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        SNAPSHOT_ID: ${{ steps.publish.outputs.image_id }}
        STACK_ENV: ${{ env.ENVIRONMENT }}
      run: |
        set -euo pipefail
        stack_id="$(jq -r '.id' <<< "$DATA_JSON")"
        keep_last="$(jq -r 'if .hetzner.keep_last == null then 3 else .hetzner.keep_last end' <<< "$DATA_JSON")"
        selector_file="$(mktemp)"
        images_file="$(mktemp)"
        jq -nc --arg id "$stack_id" --arg env "$STACK_ENV" \
          '{managed_by:"stax", stax_stack_id:$id, stax_env:$env, stax_build_target:"hetzner"}' > "$selector_file"
        label_selector="$(jq -rn --arg id "$stack_id" --arg env "$STACK_ENV" \
          '"managed_by=stax,stax_stack_id=\($id),stax_env=\($env),stax_build_target=hetzner" | @uri')"
        images='[]'
        page=1
        for ((attempt = 1; attempt <= 20; attempt++)); do
          response="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --header "Authorization: Bearer ${HCLOUD_TOKEN}" \
            --header "Accept: application/json" \
            "https://api.hetzner.cloud/v1/images?type=snapshot&per_page=50&page=${page}&label_selector=${label_selector}")"
          images="$(jq -c --argjson acc "$images" '$acc + (.images // [])' <<< "$response")"
          next="$(jq -r '.meta.pagination.next_page // empty' <<< "$response")"
          if [[ -z "$next" || "$next" == "null" ]]; then
            break
          fi
          page="$next"
        done
        printf '%s' "$images" > "$images_file"
        protect_args=()
        if [[ -n "$SNAPSHOT_ID" ]]; then
          protect_args=(--protect "$SNAPSHOT_ID")
        fi
        delete_ids="$(node "$GITHUB_WORKSPACE/workflow-src/.github/scripts/packer-build-target.mjs" retention-plan \
          --images "$images_file" \
          --selector "$selector_file" \
          --keep-last "$keep_last" \
          "${protect_args[@]}")"
        rm -f -- "$selector_file" "$images_file"
        if [[ "$delete_ids" == "[]" ]]; then
          echo "No snapshots to delete."
          exit 0
        fi
        while read -r image_id; do
          [[ -n "$image_id" ]] || continue
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer ${HCLOUD_TOKEN}" \
            --header "Accept: application/json" \
            "https://api.hetzner.cloud/v1/images/${image_id}"
          echo "Deleted Hetzner snapshot ${image_id}."
        done < <(jq -r '.[]' <<< "$delete_ids")

    - name: Clean up Packer credentials and temporary files
      if: ${{ always() }}
      shell: bash
      env:
        PACKER_VARS_FILE: ${{ steps.packer-vars.outputs.file }}
        PACKER_VERSION: ${{ steps.preflight.outputs.packer-version }}
      run: |
        set +e
        if command -v az > /dev/null 2>&1; then
          az logout > /dev/null 2>&1
          az account clear > /dev/null 2>&1
        fi
        if [[ -n "$PACKER_VARS_FILE" ]]; then
          rm -f -- "$PACKER_VARS_FILE"
        fi
        rm -f -- "$RUNNER_TEMP"/packer-*.pkrvars.json
        rm -f -- "$RUNNER_TEMP"/packer_*.zip "$RUNNER_TEMP"/packer_*_SHA256SUMS
        if [[ -n "$PACKER_VERSION" ]]; then
          rm -rf -- "$RUNNER_TEMP/packer-$PACKER_VERSION"
        fi
        rm -rf -- "$GITHUB_WORKSPACE/trusted-actions" "$GITHUB_WORKSPACE/source_repo" "$GITHUB_WORKSPACE/externalRepos"

  transfer:
    name: "Transfer Packer output ${{ fromJson(inputs.data)['name'] || fromJson(inputs.data)['id'] }}"
    needs: packer
    if: ${{ needs.packer.result == 'success' && needs.packer.outputs.image_id != '' && needs.packer.outputs.transfer_requested
      == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ fromJson(inputs.env)['environment'] || 'dev' }}
    steps:
    - name: Checkout trusted actions
      uses: actions/checkout@v7
      with:
        repository: GEBITSolutions/stax
        ref: ${{ needs.packer.outputs.actions_sha }}
        path: trusted-actions
        clean: true
        persist-credentials: false

    - name: Checkout Packer workflow scripts
      uses: actions/checkout@v7
      with:
        repository: ${{ needs.packer.outputs.workflow_repository }}
        ref: ${{ needs.packer.outputs.workflow_ref }}
        path: workflow-src
        persist-credentials: false

    - name: Prepare requested output transfer
      id: output-transfer
      shell: bash
      env:
        DATA_JSON: ${{ inputs.data }}
        IMAGE_ID: ${{ needs.packer.outputs.image_id }}
        IMAGE_REF: ${{ needs.packer.outputs.image_ref }}
        BUILD_TARGET: ${{ needs.packer.outputs.build_target }}
        VERSION: ${{ needs.packer.outputs.version }}
        LABELS: ${{ needs.packer.outputs.labels }}
        GIT_SHA: ${{ needs.packer.outputs.git_sha }}
      run: |
        set -euo pipefail
        stack_id="$(jq -er 'if (.id | type) == "string" then .id else error("id must be a string") end' <<< "$DATA_JSON")"
        requested_file="$(mktemp)"
        outputs_file="$(mktemp)"
        jq -c '."output-var" // []' <<< "$DATA_JSON" > "$requested_file"
        jq -cn \
          --arg image_id "$IMAGE_ID" \
          --arg image_ref "$IMAGE_REF" \
          --arg build_target "$BUILD_TARGET" \
          --arg version "$VERSION" \
          --arg labels "$LABELS" \
          --arg git_sha "$GIT_SHA" \
          '{image_id:$image_id, image_ref:$image_ref, build_target:$build_target, version:$version, labels:$labels, git_sha:$git_sha}' \
          > "$outputs_file"
        variables="$(node "$GITHUB_WORKSPACE/workflow-src/.github/scripts/packer-build-target.mjs" transfer-variables \
          --stack-id "$stack_id" \
          --requested "$requested_file" \
          --outputs "$outputs_file")"
        rm -f -- "$requested_file" "$outputs_file"
        if [[ "$variables" == "{}" ]]; then
          echo "::error::None of the requested Packer outputs were produced."
          exit 1
        fi
        echo "variables=$variables" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App Token for output transfer
      id: app-token
      if: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL == '' && (vars.RELEASE_APP_CLIENT_ID != '' || vars.RELEASE_GH_APP_ID != '') }}
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_GH_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_CLIENT_SECRET || secrets.RELEASE_GH_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-environments: write

    - name: Export image_id to Key Vault (Keystore SP)
      if: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL != '' && vars.REPO_KEYSTORE_SP_CLIENT_ID != '' }}
      uses: ./trusted-actions/.github/actions/gh-data-transfer/v2
      with:
        environment-name: ${{ fromJson(inputs.env)['environment'] || 'dev' }}
        key-vault-url: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL }}
        key-vault-sp-client-id: ${{ vars.REPO_KEYSTORE_SP_CLIENT_ID }}
        key-vault-sp-client-secret: ${{ vars.REPO_KEYSTORE_OIDC_ENABLED != 'true' && secrets.REPO_KEYSTORE_SP_CLIENT_SECRET
          || '' }}
        key-vault-sp-tenant-id: ${{ vars.REPO_KEYSTORE_SP_TENANT_ID }}
        variables: ${{ steps.output-transfer.outputs.variables }}

    - name: Export image_id to Key Vault (ARM SP)
      if: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL != '' && vars.REPO_KEYSTORE_SP_CLIENT_ID == '' }}
      uses: ./trusted-actions/.github/actions/gh-data-transfer/v2
      with:
        environment-name: ${{ fromJson(inputs.env)['environment'] || 'dev' }}
        key-vault-url: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL }}
        key-vault-sp-client-id: ${{ vars.ARM_CLIENT_ID || secrets.ARM_CLIENT_ID }}
        key-vault-sp-client-secret: ${{ vars.OIDC_ENABLED != 'true' && secrets.ARM_CLIENT_SECRET || '' }}
        key-vault-sp-tenant-id: ${{ vars.ARM_TENANT_ID || secrets.ARM_TENANT_ID }}
        variables: ${{ steps.output-transfer.outputs.variables }}

    - name: Export image_id to GitHub Environment
      if: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL == '' }}
      uses: ./trusted-actions/.github/actions/gh-data-transfer/v2
      with:
        environment-name: ${{ fromJson(inputs.env)['environment'] || 'dev' }}
        github-token: ${{ steps.app-token.outputs.token || secrets.CI_ENV_TRANSFER_GH_TOKEN }}
        variables: ${{ steps.output-transfer.outputs.variables }}
