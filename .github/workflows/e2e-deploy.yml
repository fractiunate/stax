---
name: "E2E: Deploy and destroy"

# Applies an OpenTofu stack (local state, no cloud provider) and a script stack that
# consumes its output, as a project's deploy workflow would. Values between stacks are
# stored as variables of the GitHub Environment "e2e" through the release GitHub App.
# Then destroys the OpenTofu stack. Stored variables are deleted before and after the
# run; runs are serialized because they share these variables. See e2e/README.md.

on:
  pull_request:
  workflow_dispatch:

# The stack dispatcher declares these for other stack types; nested workflows need them.
permissions:
  actions: read
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && format('stax-e2e-fork-{0}', github.event.pull_request.number) || 'stax-e2e-deploy' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: e2e
  STORED_VARIABLES: E2E_TOFU__MESSAGE E2E_CONSUMER__DERIVED

jobs:
  fork-verify:
    name: Verify trusted deploy acceptance
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts
        persist-credentials: false
    - uses: actions/github-script@v8
      with:
        script: |
          const { pathToFileURL } = await import('node:url');
          const { trustedDeployRun } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/e2e-trusted-run.mjs`).href);
          const sha = context.payload.pull_request.head.sha;
          for (let attempt = 0; attempt < 60; attempt++) {
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'e2e-deploy.yml', event: 'workflow_dispatch', head_sha: sha, per_page: 100,
            });
            const run = trustedDeployRun(runs, process.env.GITHUB_REPOSITORY, sha);
            if (run?.status === 'completed') {
              if (run.conclusion !== 'success') throw new Error(`Trusted deploy failed: ${run.html_url}`);
              core.info(`Exact-commit deploy acceptance passed: ${run.html_url}`);
              return;
            }
            core.info(`Awaiting maintainer-dispatched e2e-deploy.yml acceptance for ${sha}`);
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('No successful upstream deploy acceptance for this PR head. A maintainer must dispatch e2e-deploy.yml on a reviewed upstream branch at the exact head SHA.');

  reset:
    name: Delete stored outputs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: e2e/assert
        persist-credentials: false
    - id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_APP_CLIENT_SECRET }}
        repositories: ${{ github.event.repository.name }}
    - run: |
        read -ra names <<<"${STORED_VARIABLES}"
        e2e/assert/run.sh delete-variables "${ENVIRONMENT}" "${names[@]}"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}

  setup:
    name: Setup
    needs: reset
    uses: ./.github/workflows/a-wf-setup-ci.yml
    with:
      environment: e2e
      stack_filter: ""
      dry-run: false
      release_config_filepath: e2e/configs/deploy.yaml
      skip-azure-credentials-validation: true
      artifact_prefix: e2e-deploy
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  apply:
    name: Apply
    needs: setup
    uses: ./.github/workflows/a-wf-deploy-levels.yml
    secrets: inherit
    with:
      ci_config: ${{ needs.setup.outputs.ci-config }}
      env: ${{ needs.setup.outputs.env }}
      default_location: ${{ needs.setup.outputs.default-location }}
      external_repos: ${{ needs.setup.outputs.external-repos }}
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  verify:
    name: Check stored outputs
    needs: [setup, apply]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ fromJSON(needs.setup.outputs.env).release_tag_name }}
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: e2e/assert
        persist-credentials: false
    - id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_APP_CLIENT_SECRET }}
        repositories: ${{ github.event.repository.name }}
    - name: OpenTofu output and the consumer's derived value were stored
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        e2e/assert/run.sh variable "${ENVIRONMENT}" E2E_TOFU__MESSAGE "${RELEASE_TAG}"
        e2e/assert/run.sh variable "${ENVIRONMENT}" E2E_CONSUMER__DERIVED "${RELEASE_TAG}-derived"

  destroy-setup:
    name: Setup destroy
    needs: verify
    uses: ./.github/workflows/a-wf-setup-ci.yml
    with:
      environment: e2e
      stack_filter: e2e-tofu
      dry-run: false
      destroy: true
      release_config_filepath: e2e/configs/deploy.yaml
      skip-azure-credentials-validation: true
      artifact_prefix: e2e-destroy
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  # A single stack: call the stack dispatcher directly. A second deploy-levels call
  # would exceed GitHub's size limit for one workflow run.
  destroy:
    name: Destroy
    needs: destroy-setup
    uses: ./.github/workflows/a-wf-deploy-stack.yml
    secrets: inherit
    with:
      data: ${{ toJSON(fromJSON(needs.destroy-setup.outputs.ci-config)[0][0]) }}
      env: ${{ needs.destroy-setup.outputs.env }}
      default-location: ${{ needs.destroy-setup.outputs.default-location }}
      external-repos: ${{ needs.destroy-setup.outputs.external-repos }}
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  check-destroy:
    name: Check apply and destroy jobs
    needs: destroy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: e2e/assert
        persist-credentials: false
    - run: |
        e2e/assert/run.sh jobs 'Terraform: E2E Deploy OpenTofu / TF Apply echo$' success 1
        e2e/assert/run.sh jobs 'Script GH Action E2E Deploy Consumer$' success 1
        e2e/assert/run.sh jobs 'Terraform: E2E Deploy OpenTofu / TF Destroy echo$' success 1

  cleanup:
    name: Delete stored outputs
    needs: [reset, setup, apply, verify, destroy-setup, destroy, check-destroy]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: e2e/assert
        persist-credentials: false
    - id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_APP_CLIENT_SECRET }}
        repositories: ${{ github.event.repository.name }}
    - run: |
        read -ra names <<<"${STORED_VARIABLES}"
        e2e/assert/run.sh delete-variables "${ENVIRONMENT}" "${names[@]}"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}

  result:
    name: "E2E: Deploy and destroy"
    needs: [fork-verify, reset, setup, apply, verify, destroy-setup, destroy, check-destroy, cleanup]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: All jobs succeeded
      env:
        RESULTS: ${{ toJSON(needs) }}
        FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${RESULTS}"
        jq -e --arg fork "${FORK_PR}" 'if $fork == "true" then .["fork-verify"].result == "success" else all(to_entries[] | select(.key != "fork-verify"); .value.result == "success") end' <<<"${RESULTS}" >/dev/null
