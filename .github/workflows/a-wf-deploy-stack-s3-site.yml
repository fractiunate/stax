---
# yamllint disable rule:line-length
name: ".Deploy S3 Static Site Workflow (Abstract)"
on:
  workflow_call:
    inputs:
      data:
        type: string
        required: true
      env:
        type: string
        required: true
      external-repos:
        type: string
        required: false
        default: "[]"
      stack-repository:
        type: string
        required: false
        default: ""
      stack-repository-version:
        type: string
        required: false
        default: ""
      actions-repository:
        type: string
        required: false
        default: "GEBITSolutions/stax"
      actions-version:
        type: string
        required: false
        default: "1.5.0"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
      AWS_ROLE_ARN:
        required: false
      ARM_CLIENT_SECRET:
        required: false
      ARM_CLIENT_ID:
        required: false
      ARM_SUBSCRIPTION_ID:
        required: false
      ARM_TENANT_ID:
        required: false
      REPO_KEYSTORE_SP_CLIENT_SECRET:
        required: false
      RELEASE_APP_CLIENT_SECRET:
        required: false
      RELEASE_GH_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  id-token: write
  # pipeline-job-backlink lists the run's jobs.
  actions: read

jobs:
  s3-site-deploy:
    name: "Deploy S3 Site ${{ fromJson(inputs.data)['id'] }}"
    runs-on: ${{ fromJson(inputs.data)['runs-on'] || 'ubuntu-latest' }}
    environment: ${{ fromJson(inputs.env)['environment'] }}
    env:
      ENVIRONMENT: "${{ fromJson(inputs.env)['environment'] || 'default' }}"
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID || secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ vars.OIDC_ENABLED != 'true' && secrets.ARM_CLIENT_SECRET || '' }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID || secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID || secrets.ARM_SUBSCRIPTION_ID }}
    steps:
    - name: Resolve App Token Scope
      id: token-scope
      shell: bash
      run: |
        repositories="${GITHUB_REPOSITORY#*/}"
        stack_repository="${{ inputs.stack-repository }}"
        if [[ "$stack_repository" == "${GITHUB_REPOSITORY_OWNER}/"* ]]; then
          stack_repo="${stack_repository#*/}"
          if [[ -n "$stack_repo" && "$stack_repo" != "$repositories" ]]; then
            repositories="${repositories},${stack_repo}"
          fi
        fi
        while read -r repo_url; do
          repo_ref=$(echo "$repo_url" | sed -E 's#.*github\.com[:/]([^/]+)/([^/.]+)(\.git)?$#\1/\2#')
          repo_owner="${repo_ref%%/*}"
          repo_name="${repo_ref#*/}"
          if [[ "$repo_owner" == "$GITHUB_REPOSITORY_OWNER" && "$repo_name" != "$repo_ref" && ",${repositories}," != *",${repo_name},"* ]]; then
            repositories="${repositories},${repo_name}"
          fi
        done < <(echo '${{ inputs.external-repos || '[]' }}' | jq -r '. | to_entries[]? | .value[0]?.repoURL // empty')
        echo "repositories=${repositories}" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App Token
      id: app-token
      if: ${{ vars.RELEASE_APP_CLIENT_ID != '' || vars.RELEASE_GH_APP_ID != '' }}
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_GH_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_CLIENT_SECRET || secrets.RELEASE_GH_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ steps.token-scope.outputs.repositories }}

    - name: "Checkout Actions"
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.actions-repository || 'GEBITSolutions/stax' }}
        ref: ${{ inputs.actions-version || 'main' }}
        clean: false

    - id: source-repo
      name: Determine source repository and token
      shell: bash
      run: |
        stack_repository="${{ inputs.stack-repository }}"
        if [[ "$stack_repository" == */* ]]; then
          echo "Using direct source repository: $stack_repository"
          echo "stack-repository=$stack_repository" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        source_repo_resolved=false
        if [[ $(echo '${{ inputs.external-repos }}' | jq -c '. | to_entries[]' | wc -l) -gt 0 ]]; then
          while read -r repo; do
            repo_key=$(echo "$repo" | jq -r '.key')
            repoURL=$(echo "$repo" | jq -r '.value[0].repoURL')
            repoName=$(basename "$repoURL" .git)
            repoOrg=$(echo "$repoURL" | sed -E 's|.*github\.com[:/]([^/]+)/.*|\1|')
            echo "Checking Repo ID: $repo_key against source repo: $stack_repository"

            if [[ "$repo_key" == "$stack_repository" ]]; then
              echo "Found matching repo: $repoOrg/$repoName, getting token..."
              use_app_token=$(echo "$repo" | jq -r '.value[0].use_app_token // false')
              token=$(echo "$repo" | jq -r '.value[0].token // empty')
              token_value=""
              if [[ "$use_app_token" == "true" && "$repoOrg" == "$GITHUB_REPOSITORY_OWNER" ]]; then
                token_value="${{ steps.app-token.outputs.token }}"
              fi
              if [[ -z "$token_value" && -n "$token" ]]; then
                token_value=$(echo '${{ toJSON(secrets) }}' | jq --arg token "$token" -r '.[$token] // empty')
              fi
              echo "Repo Org/Name: $repoOrg/$repoName"
              echo "stack-repository=$repoOrg/$repoName" >> "$GITHUB_OUTPUT"
              if [[ -n "$token_value" ]]; then
                echo "stack-repository-token=$token_value" >> "$GITHUB_OUTPUT"
              fi
              source_repo_resolved=true
              break
            fi
          done < <(echo '${{ inputs.external-repos }}' | jq -c '. | to_entries[]')
        fi

        if [[ -n "$stack_repository" && "$source_repo_resolved" != "true" ]]; then
          echo "::error::source_repo alias '$stack_repository' was not found in inputs.external-repos"
          exit 1
        fi

    - name: "Checkout Source Repo"
      uses: actions/checkout@v7
      with:
        path: source_repo
        repository: ${{ steps.source-repo.outputs.stack-repository || github.repository }}
        ref: ${{ inputs.stack-repository-version || github.sha }}
        token: ${{ steps.source-repo.outputs.stack-repository-token || (steps.source-repo.outputs.stack-repository == github.repository && github.token) || (startsWith(steps.source-repo.outputs.stack-repository, format('{0}/', github.repository_owner)) && steps.app-token.outputs.token) || github.token }}
        clean: false

    - name: Merge stack to global-vars
      id: merge-global-vars
      uses: actions/github-script@v8
      with:
        result-encoding: json
        script: |
          const GLOBALS = ${{ toJson(fromJson(inputs.data)['globals']) || '{}' }};
          return {
              ...GLOBALS,
              "stack_id": "${{ fromJson(inputs.data)['id'] }}",
              "deployment_id": "${{ fromJson(inputs.data)['id'] }}-${{ env.STAGE }}-${{ env.CUSTOMER_ID }}"
          }

    - id: convert-inputs
      name: Convert Inputs
      if: (vars.REPO_KEYSTORE_SSM_PREFIX == '' && vars.REPO_KEYSTORE_KEY_VAULT_URL == '')
      uses: ./.github/actions/gh-convert-stack-inputs
      with:
        variables: ${{ toJson(vars) }}
        secrets: ${{ toJson(secrets) }}
        convertInputs: ${{ toJson(fromJson(inputs.data)['input']) }}
        additionalInputs: ${{ steps.merge-global-vars.outputs.result }}
        pipeline-globals: ${{ inputs.env }}

    - id: convert-inputs-ssm
      name: Convert Inputs SSM
      if: (vars.REPO_KEYSTORE_SSM_PREFIX != '')
      uses: ./.github/actions/gh-convert-stack-inputs
      with:
        variables: ${{ toJson(vars) }}
        secrets: ${{ toJson(secrets) }}
        convertInputs: ${{ toJson(fromJson(inputs.data)['input']) }}
        additionalInputs: ${{ steps.merge-global-vars.outputs.result }}
        pipeline-globals: ${{ inputs.env }}
        environment-name: ${{ env.ENVIRONMENT }}
        ssm-parameter-prefix: ${{ vars.REPO_KEYSTORE_SSM_PREFIX }}
        aws-region: ${{ vars.REPO_KEYSTORE_SSM_REGION }}
        aws-role-arn: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
        aws-access-key-id: ${{ vars.OIDC_ENABLED != 'true' && secrets.AWS_ACCESS_KEY_ID || '' }}
        aws-secret-access-key: ${{ vars.OIDC_ENABLED != 'true' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
        aws-session-token: ${{ vars.OIDC_ENABLED != 'true' && secrets.AWS_SESSION_TOKEN || '' }}

    - id: convert-inputs-key-vault
      name: Convert Inputs Key Vault (ARM SP)
      if: (vars.REPO_KEYSTORE_SSM_PREFIX == '' && vars.REPO_KEYSTORE_KEY_VAULT_URL != '' && vars.REPO_KEYSTORE_SP_CLIENT_ID
        == '')
      uses: ./.github/actions/gh-convert-stack-inputs
      with:
        variables: ${{ toJson(vars) }}
        secrets: ${{ toJson(secrets) }}
        convertInputs: ${{ toJson(fromJson(inputs.data)['input']) }}
        additionalInputs: ${{ steps.merge-global-vars.outputs.result }}
        pipeline-globals: ${{ inputs.env }}
        environment-name: ${{ env.ENVIRONMENT }}
        key-vault-url: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL || '' }}
        key-vault-sp-client-id: ${{ env.ARM_CLIENT_ID }}
        key-vault-sp-client-secret: ${{ env.ARM_CLIENT_SECRET }}
        key-vault-sp-tenant-id: ${{ env.ARM_TENANT_ID }}
        oidc-enabled: ${{ vars.OIDC_ENABLED || 'false' }}

    - id: convert-inputs-key-vault-keystore
      name: Convert Inputs Key Vault (Keystore SP)
      if: (vars.REPO_KEYSTORE_SSM_PREFIX == '' && vars.REPO_KEYSTORE_KEY_VAULT_URL != '' && vars.REPO_KEYSTORE_SP_CLIENT_ID
        != '')
      uses: ./.github/actions/gh-convert-stack-inputs
      with:
        variables: ${{ toJson(vars) }}
        secrets: ${{ toJson(secrets) }}
        convertInputs: ${{ toJson(fromJson(inputs.data)['input']) }}
        additionalInputs: ${{ steps.merge-global-vars.outputs.result }}
        pipeline-globals: ${{ inputs.env }}
        environment-name: ${{ env.ENVIRONMENT }}
        key-vault-url: ${{ vars.REPO_KEYSTORE_KEY_VAULT_URL || '' }}
        key-vault-sp-client-id: ${{ vars.REPO_KEYSTORE_SP_CLIENT_ID }}
        key-vault-sp-client-secret: ${{ vars.REPO_KEYSTORE_OIDC_ENABLED != 'true' && secrets.REPO_KEYSTORE_SP_CLIENT_SECRET
          || '' }}
        key-vault-sp-tenant-id: ${{ vars.REPO_KEYSTORE_SP_TENANT_ID }}
        oidc-enabled: ${{ vars.REPO_KEYSTORE_OIDC_ENABLED || 'false' }}

    - name: Resolve deploy target
      id: resolve-target
      shell: bash
      env:
        TF_VARS_MAP: ${{ steps.convert-inputs-ssm.outputs.tf-vars-map || steps.convert-inputs-key-vault-keystore.outputs.tf-vars-map
          || steps.convert-inputs-key-vault.outputs.tf-vars-map || steps.convert-inputs.outputs.tf-vars-map }}
        REGION: ${{ fromJson(inputs.data)['location'] || '' }}
      run: |
        get_input() {
          jq -r --arg key "$1" '[.[] | select(.key == $key) | .value][0] // empty' <<< "${TF_VARS_MAP:-[]}"
        }

        bucket_name="$(get_input bucket_name)"
        distribution_id="$(get_input distribution_id)"
        site_url="$(get_input site_url)"
        bucket_prefix="$(get_input bucket_prefix)"
        bucket_prefix="${bucket_prefix#/}"

        missing=false
        if [[ -z "$bucket_name" ]]; then
          echo "::error::Input 'bucket_name' is required for s3-site-deploy"
          missing=true
        fi
        if [[ -z "$distribution_id" ]]; then
          echo "::error::Input 'distribution_id' is required for s3-site-deploy"
          missing=true
        fi
        if [[ -z "$REGION" ]]; then
          echo "::error::Stack field 'location' (AWS region) is required for s3-site-deploy"
          missing=true
        fi
        if [[ "$missing" == "true" ]]; then
          exit 1
        fi

        echo "Target: s3://${bucket_name}/${bucket_prefix} (${REGION}), distribution ${distribution_id}"
        {
          echo "bucket-name=${bucket_name}"
          echo "distribution-id=${distribution_id}"
          echo "site-url=${site_url}"
          echo "bucket-prefix=${bucket_prefix}"
          echo "region=${REGION}"
        } >> "$GITHUB_OUTPUT"

    - name: Build static site
      id: build
      uses: ./.github/actions/static-site-build
      with:
        source-type: ${{ fromJson(inputs.data)['site_source_type'] || 'mkdocs' }}
        docs-path: ${{ fromJson(inputs.data)['docs_path'] || 'docs' }}
        app-location: ${{ fromJson(inputs.data)['app_location'] || '' }}
        site-url: ${{ steps.resolve-target.outputs.site-url }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ steps.resolve-target.outputs.region }}
        role-to-assume: ${{ vars.OIDC_ENABLED == 'true' && (vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN) || '' }}
        aws-access-key-id: ${{ vars.OIDC_ENABLED != 'true' && secrets.AWS_ACCESS_KEY_ID || '' }}
        aws-secret-access-key: ${{ vars.OIDC_ENABLED != 'true' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
        aws-session-token: ${{ vars.OIDC_ENABLED != 'true' && secrets.AWS_SESSION_TOKEN || '' }}

    - name: Sync site to S3
      shell: bash
      env:
        SITE: ${{ steps.build.outputs.site-dir }}
        BUCKET: ${{ steps.resolve-target.outputs.bucket-name }}
        PREFIX: ${{ steps.resolve-target.outputs.bucket-prefix }}
        DRY_RUN: ${{ fromJson(inputs.env)['dry_run'] || 'true' }}
      run: |
        dry=()
        if [[ "$DRY_RUN" != "false" ]]; then
          dry=(--dryrun)
        fi
        target="s3://${BUCKET}/${PREFIX}"

        echo "::group::Pass 1: assets (public, max-age=86400)"
        aws s3 sync "$SITE" "$target" --exclude '*.html' --exclude '*.json' --exclude '*.xml' \
          --cache-control 'public, max-age=86400' "${dry[@]}"
        echo "::endgroup::"

        echo "::group::Pass 2: HTML/JSON/XML (no-cache)"
        aws s3 sync "$SITE" "$target" --exclude '*' --include '*.html' --include '*.json' --include '*.xml' \
          --cache-control 'no-cache' "${dry[@]}"
        echo "::endgroup::"

        # Separate sweep: --delete skips filtered paths, and deleting assets before new HTML exists would break pages.
        echo "::group::Pass 3: delete stale objects"
        aws s3 sync "$SITE" "$target" --delete "${dry[@]}"
        echo "::endgroup::"

    - name: Invalidate CloudFront cache
      if: ${{ (fromJson(inputs.env)['dry_run'] || 'true') == 'false' }}
      shell: bash
      env:
        DISTRIBUTION_ID: ${{ steps.resolve-target.outputs.distribution-id }}
      run: |
        invalidation_id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
          --paths '/*' --query Invalidation.Id --output text)
        echo "Waiting for invalidation ${invalidation_id}"
        aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"

    - name: Add pipeline job backlink
      if: ${{ !cancelled() }}
      uses: ./.github/actions/pipeline-job-backlink
      with:
        job-name: ${{ format('Deploy S3 Site {0}', fromJson(inputs.data)['id']) }}
