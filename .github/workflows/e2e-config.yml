---
name: "E2E: Config resolution"

# Resolves two deploy config files through a-wf-setup-ci.yml (setup only, nothing is
# deployed) and checks deployment value precedence, per-file globals, explicit and
# implicit dependencies across files, stack filters and if conditions. It also resolves
# Azure and AWS state configs (config-profile: state) and dry-runs a-wf-deploy-state.yml.
# See e2e/README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  all:
    name: Base + overlay
    uses: ./.github/workflows/a-wf-setup-ci.yml
    with:
      environment: e2e
      stack_filter: ""
      release_config_filepath: e2e/configs/config-base.yaml,e2e/configs/config-overlay.yaml
      skip-azure-credentials-validation: true
      artifact_prefix: e2e-config-all
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  group:
    name: Overlay + base, stack group
    uses: ./.github/workflows/a-wf-setup-ci.yml
    with:
      environment: e2e
      stack_filter: group-core
      release_config_filepath: e2e/configs/config-overlay.yaml,e2e/configs/config-base.yaml
      skip-azure-credentials-validation: true
      artifact_prefix: e2e-config-group
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  upstream:
    name: Overlay + base, stack with dependencies
    uses: ./.github/workflows/a-wf-setup-ci.yml
    with:
      environment: e2e
      stack_filter: ">e2e-app"
      release_config_filepath: e2e/configs/config-overlay.yaml,e2e/configs/config-base.yaml
      skip-azure-credentials-validation: true
      artifact_prefix: e2e-config-upstream
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  state-azure-setup:
    name: State config (Azure)
    uses: ./.github/workflows/a-wf-setup-ci.yml
    with:
      environment: e2e
      stack_filter: ""
      config-profile: state
      release_config_filepath: e2e/configs/state-azure.yaml
      skip-azure-credentials-validation: true
      artifact_prefix: e2e-state-azure
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  state-azure:
    name: State backend dry run (Azure)
    needs: state-azure-setup
    uses: ./.github/workflows/a-wf-deploy-state.yml
    with:
      env: ${{ needs.state-azure-setup.outputs.env }}
      default_location: ${{ needs.state-azure-setup.outputs.default-location }}
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  state-aws-setup:
    name: State config (AWS)
    uses: ./.github/workflows/a-wf-setup-ci.yml
    with:
      environment: e2e
      stack_filter: ""
      config-profile: state
      release_config_filepath: e2e/configs/state-aws.yaml
      skip-azure-credentials-validation: true
      artifact_prefix: e2e-state-aws
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  state-aws:
    name: State backend dry run (AWS)
    needs: state-aws-setup
    uses: ./.github/workflows/a-wf-deploy-state.yml
    with:
      env: ${{ needs.state-aws-setup.outputs.env }}
      default_location: ${{ needs.state-aws-setup.outputs.default-location }}
      actions-repository: ${{ github.repository }}
      actions-version: ${{ github.sha }}

  check:
    name: Check resolved configs
    needs: [all, group, upstream, state-azure, state-aws]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: e2e/assert
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false
    - run: node e2e/assert/config.mjs
      env:
        RUN_ALL_CONFIG: ${{ needs.all.outputs.ci-config }}
        RUN_ALL_ENV: ${{ needs.all.outputs.env }}
        RUN_ALL_LOCATION: ${{ needs.all.outputs.default-location }}
        RUN_GROUP_CONFIG: ${{ needs.group.outputs.ci-config }}
        RUN_GROUP_ENV: ${{ needs.group.outputs.env }}
        RUN_GROUP_LOCATION: ${{ needs.group.outputs.default-location }}
        RUN_UPSTREAM_CONFIG: ${{ needs.upstream.outputs.ci-config }}
        RUN_UPSTREAM_ENV: ${{ needs.upstream.outputs.env }}
        RUN_UPSTREAM_LOCATION: ${{ needs.upstream.outputs.default-location }}
    - run: node e2e/assert/state.mjs
      env:
        RUN_AZURE_PLAN: ${{ toJSON(needs.state-azure.outputs) }}
        RUN_AWS_PLAN: ${{ toJSON(needs.state-aws.outputs) }}

  result:
    name: "E2E: Config resolution"
    needs: [all, group, upstream, state-azure-setup, state-azure, state-aws-setup, state-aws, check]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: All jobs succeeded
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${RESULTS}"
        jq -e 'all(.[]; .result == "success")' <<<"${RESULTS}" >/dev/null
