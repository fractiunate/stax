---
# yamllint disable rule:line-length
name: ".Packer Workflow (Abstract)"
on:
  workflow_call:
    inputs:
      data:
        type: string
        required: true
      env:
        type: string
        required: true
      external-repos:
        type: string
        required: false
        default: "[]"
      actions-repository:
        type: string
        required: false
        default: "GEBITSolutions/stax"
      actions-version:
        type: string
        required: false
        default: "1.5.0"
    outputs:
      image_id:
        description: "Cloud-native image id (Gallery version resource id or Hetzner snapshot id)"
        value: ${{ jobs.azure.outputs.image_id || jobs.hetzner.outputs.image_id }}
      image_ref:
        description: "Opaque locator azure:gallery:... or hcloud:snapshot:<id>"
        value: ${{ jobs.azure.outputs.image_ref || jobs.hetzner.outputs.image_ref }}
      build_target:
        description: "azure, hetzner, or aws"
        value: ${{ jobs.azure.outputs.build_target || jobs.hetzner.outputs.build_target }}
      version:
        description: "Gallery image version, or 0.0.0+<git sha> for Hetzner"
        value: ${{ jobs.azure.outputs.version || jobs.hetzner.outputs.version }}
      labels:
        description: "JSON object of tags or snapshot labels"
        value: ${{ jobs.azure.outputs.labels || jobs.hetzner.outputs.labels }}
      git_sha:
        description: "Source commit recorded for this build"
        value: ${{ jobs.azure.outputs.git_sha || jobs.hetzner.outputs.git_sha }}
    secrets:
      ARM_CLIENT_SECRET:
        required: false
      ARM_CLIENT_ID:
        required: false
      ARM_TENANT_ID:
        required: false
      REPO_KEYSTORE_SP_CLIENT_SECRET:
        required: false
      RELEASE_APP_CLIENT_SECRET:
        required: false
      RELEASE_GH_APP_PRIVATE_KEY:
        required: false
      CI_ENV_TRANSFER_GH_TOKEN:
        required: false
      HCLOUD_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  route:
    name: "Select Packer build target"
    runs-on: ubuntu-latest
    outputs:
      build_target: ${{ steps.select.outputs.build_target }}
    steps:
    - name: Select publisher
      id: select
      shell: bash
      env:
        DATA_JSON: ${{ inputs.data }}
      run: |
        set -euo pipefail
        jq -e 'type == "object"' <<< "$DATA_JSON" > /dev/null || {
          echo "::error::Packer data must be a JSON object."
          exit 1
        }
        if [[ "$(jq -r '.type // empty' <<< "$DATA_JSON")" != "packer" ]]; then
          echo "::error::The Packer executor only accepts descriptors with type 'packer'."
          exit 1
        fi
        build_target="$(jq -r '
          if has("build_target") | not then
            "azure"
          elif (.build_target | type) == "string" then
            .build_target
          else
            "invalid"
          end
        ' <<< "$DATA_JSON")"
        case "$build_target" in
          azure|hetzner)
            ;;
          aws)
            echo "::error::build_target aws is reserved and not implemented. Outputs stay image_id, image_ref, build_target, version, labels and git_sha when an AMI workflow is added."
            exit 1
            ;;
          *)
            echo "::error::build_target must be azure, hetzner, or aws."
            exit 1
            ;;
        esac
        echo "build_target=$build_target" >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2016 # Backticks are literal Markdown delimiters.
        printf '### Packer build target\n\n- build_target: `%s`\n' "$build_target" >> "$GITHUB_STEP_SUMMARY"

  azure:
    needs: route
    if: needs.route.outputs.build_target == 'azure'
    name: "Packer Azure: ${{ fromJson(inputs.data)['name'] || fromJson(inputs.data)['id'] }}"
    uses: ./.github/workflows/a-wf-deploy-stack-packer-azure.yml
    with:
      data: ${{ inputs.data }}
      env: ${{ inputs.env }}
      external-repos: ${{ inputs.external-repos }}
      actions-repository: ${{ inputs.actions-repository }}
      actions-version: ${{ inputs.actions-version }}
    secrets: inherit

  hetzner:
    needs: route
    if: needs.route.outputs.build_target == 'hetzner'
    name: "Packer Hetzner: ${{ fromJson(inputs.data)['name'] || fromJson(inputs.data)['id'] }}"
    uses: ./.github/workflows/a-wf-deploy-stack-packer-hetzner.yml
    with:
      data: ${{ inputs.data }}
      env: ${{ inputs.env }}
      external-repos: ${{ inputs.external-repos }}
      actions-repository: ${{ inputs.actions-repository }}
      actions-version: ${{ inputs.actions-version }}
    secrets: inherit
